name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # Setup Java 17
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ============================================================
      # Verify Java
      # ============================================================
      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')

          if [ -z "$JAVA_VERSION" ]; then
            echo "Failed to detect Java version."
            exit 1
          fi

          MAJOR_VERSION=$(echo "$JAVA_VERSION" | awk -F '.' '{if ($1 == 1) print $2; else print $1}')

          if [ -z "$MAJOR_VERSION" ]; then
            echo "Failed to detect major Java version."
            exit 1
          fi

          echo "Detected Java Major Version: $MAJOR_VERSION"

          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Java version is lower than 17."
            exit 1
          fi

      # ============================================================
      # Setup Gradle
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      # ============================================================
      # Prepare Debug Keystore
      #
      # If ./debug.keystore already exists, use it.
      # Otherwise create one.
      # ============================================================
      - name: Prepare debug keystore
        run: |
          DEBUG_KEYSTORE="$GITHUB_WORKSPACE/debug.keystore"
          GRADLE_DEBUG_KEYSTORE="$HOME/.android/debug.keystore"

          mkdir -p "$HOME/.android"

          if [ -f "$DEBUG_KEYSTORE" ]; then
            echo "Existing repository debug.keystore found."
            echo "Using existing debug.keystore."

          else
            echo "No repository debug.keystore found."
            echo "Generating a new debug.keystore..."

            keytool -genkeypair \
              -v \
              -keystore "$DEBUG_KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "$DEBUG_KEYSTORE" ]; then
            echo "ERROR: debug.keystore does not exist."
            exit 1
          fi

          # Make the same keystore available at the standard
          # Gradle debug-keystore location.
          cp "$DEBUG_KEYSTORE" "$GRADLE_DEBUG_KEYSTORE"

          echo ""
          echo "Debug keystore:"
          ls -lh "$DEBUG_KEYSTORE"

          echo ""
          echo "Gradle debug keystore:"
          ls -lh "$GRADLE_DEBUG_KEYSTORE"

      # ============================================================
      # Show Debug Keystore SHA-1
      # ============================================================
      - name: Show debug keystore SHA-1
        run: |
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"

          echo ""
          echo "=================================================="
          echo "DEBUG KEYSTORE CERTIFICATE"
          echo "=================================================="

          keytool -list \
            -v \
            -keystore "$DEBUG_KEYSTORE" \
            -storepass android \
            -alias androiddebugkey

          echo ""
          echo "=================================================="
          echo "DEBUG KEYSTORE SHA-1"
          echo "=================================================="

          keytool -list \
            -v \
            -keystore "$DEBUG_KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            | grep -E "SHA1:|SHA-1:"

      # ============================================================
      # Build Debug APK
      # ============================================================
      - name: Build the debug APK
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # ============================================================
      # Verify APK
      # ============================================================
      - name: Verify the APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$TARGET_APK" ]; then
            echo "Expected APK not found: $TARGET_APK"

            echo ""
            echo "Searching inside app/build/outputs/apk:"
            find app/build/outputs/apk -type f -name "*.apk"

            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "APK file is empty."
            exit 1
          fi

          if [[ "$TARGET_APK" != *.apk ]]; then
            echo "File does not have .apk extension."
            exit 1
          fi

          echo "Verified APK:"
          ls -lh "$TARGET_APK"

      # ============================================================
      # Find Android SDK Build Tools / apksigner
      # ============================================================
      - name: Find apksigner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            echo ""
            echo "Available build-tools:"
            find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name "apksigner" || true
            exit 1
          fi

          echo "APKSIGNER=$APKSIGNER"

          "$APKSIGNER" version

      # ============================================================
      # Verify APK signature
      # ============================================================
      - name: Verify APK signature
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          echo "=================================================="
          echo "APK SIGNATURE VERIFICATION"
          echo "=================================================="

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$TARGET_APK"

      # ============================================================
      # Extract SHA-1 directly from FINAL APK
      #
      # This is the SHA-1 that should be registered in
      # Google Cloud Console for this APK.
      # ============================================================
      - name: Get SHA-1 from final APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "FINAL APK CERTIFICATE"
          echo "=================================================="

          CERT_OUTPUT=$("$APKSIGNER" verify \
            --print-certs \
            "$TARGET_APK")

          echo "$CERT_OUTPUT"

          echo ""
          echo "=================================================="
          echo "SHA-1 FOR GOOGLE CLOUD CONSOLE"
          echo "=================================================="

          SHA1=$(echo "$CERT_OUTPUT" \
            | grep -i "SHA-1 certificate fingerprint" \
            | sed 's/.*: //')

          if [ -z "$SHA1" ]; then
            echo "ERROR: Could not extract SHA-1 from APK."
            echo ""
            echo "Full certificate output:"
            echo "$CERT_OUTPUT"
            exit 1
          fi

          echo ""
          echo "SHA-1: $SHA1"
          echo ""
          echo "Use this SHA-1 in Google Cloud Console."
          echo "=================================================="

      # ============================================================
      # Upload Debug APK Artifact
      # ============================================================
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      # ============================================================
      # Publish GitHub Release
      # ============================================================
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.run_number }}-$(date +%s)"

          gh release create \
            "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Debug Build $TAG" \
            --notes "Automated Debug APK release via GitHub Actions."
