name: Build and Release Debug APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Setup Java 17
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'


      # ============================================================
      # 3. Verify Java
      # ============================================================
      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')

          if [ -z "$JAVA_VERSION" ]; then
            echo "Failed to detect Java version."
            exit 1
          fi

          MAJOR_VERSION=$(echo "$JAVA_VERSION" | awk -F '.' '{if ($1 == 1) print $2; else print $1}')

          if [ -z "$MAJOR_VERSION" ]; then
            echo "Failed to detect major Java version."
            exit 1
          fi

          echo "Detected Java Major Version: $MAJOR_VERSION"

          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Java version is lower than 17."
            exit 1
          fi


      # ============================================================
      # 4. Setup Gradle 9.3.1
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'


      # ============================================================
      # 5. Prepare stable Debug Keystore
      # ============================================================
      - name: Prepare debug keystore
        run: |
          mkdir -p "$HOME/.android"

          if [ -f "./debug.keystore" ]; then
            echo "Using repository debug.keystore"

            cp "./debug.keystore" "$HOME/.android/debug.keystore"

          elif [ -f "$HOME/.android/debug.keystore" ]; then
            echo "Using existing Android debug.keystore"

          else
            echo "Generating debug.keystore..."

            keytool -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "ERROR: debug.keystore was not created."
            exit 1
          fi

          echo "Debug keystore verified successfully."

          echo ""
          echo "Debug Keystore SHA-1:"
          keytool -list \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | grep -i "SHA1:" || true


      # ============================================================
      # 6. Make Gradle Wrapper executable if available
      # ============================================================
      - name: Prepare Gradle wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper not found."
            echo "Using installed Gradle."
          fi


      # ============================================================
      # 7. Build Debug APK
      # ============================================================
      - name: Build the debug APK
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon


      # ============================================================
      # 8. Find generated APK
      # ============================================================
      - name: Find generated APK
        run: |
          echo "Searching for generated APK files..."

          find . \
            -type f \
            -name "*.apk" \
            -print

          echo ""
          echo "Checking expected APK..."

          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: Expected APK was not found:"
            echo "$TARGET_APK"

            echo ""
            echo "Available APK files:"
            find . \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo ""
          echo "APK successfully generated:"
          ls -lh "$TARGET_APK"


      # ============================================================
      # 9. Verify APK
      # ============================================================
      - name: Verify the APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$TARGET_APK" ]; then
            echo "APK file does not exist."
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "APK file is empty."
            exit 1
          fi

          if [[ "$TARGET_APK" != *.apk ]]; then
            echo "File does not have .apk extension."
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$TARGET_APK")

          echo "APK size: $APK_SIZE bytes"

          if [ "$APK_SIZE" -lt 10000 ]; then
            echo "ERROR: APK size is suspiciously small."
            exit 1
          fi

          echo "APK file verification successful."


      # ============================================================
      # 10. Find apksigner
      # ============================================================
      - name: Find apksigner
        id: apksigner
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          echo "apksigner found:"
          echo "$APKSIGNER"

          echo "path=$APKSIGNER" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 11. Verify APK signature
      # ============================================================
      - name: Verify APK signature
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="${{ steps.apksigner.outputs.path }}"

          echo "Verifying APK signature..."

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$TARGET_APK"


      # ============================================================
      # 12. Get SHA-1 from FINAL APK
      # ============================================================
      - name: Get SHA-1 from final APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="${{ steps.apksigner.outputs.path }}"

          echo "Reading certificate from final APK..."

          CERT_OUTPUT=$("$APKSIGNER" verify \
            --print-certs \
            "$TARGET_APK")

          echo ""
          echo "========== APK CERTIFICATE =========="
          echo "$CERT_OUTPUT"
          echo "====================================="
          echo ""

          SHA1=$(echo "$CERT_OUTPUT" \
            | grep -i "certificate SHA-1 digest" \
            | sed 's/.*: //')

          if [ -z "$SHA1" ]; then
            echo "ERROR: Could not extract SHA-1 from APK."

            echo ""
            echo "Full certificate output:"
            echo "$CERT_OUTPUT"

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "FINAL APK SHA-1"
          echo "======================================"
          echo "$SHA1"
          echo "======================================"

          SHA1_COLON=$(echo "$SHA1" \
            | sed 's/../&:/g' \
            | sed 's/:$//')

          echo ""
          echo "SHA-1 with colons:"
          echo "$SHA1_COLON"


      # ============================================================
      # 13. Upload APK as GitHub Artifact
      # ============================================================
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1


      # ============================================================
      # 14. Publish GitHub Release
      # ============================================================
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          TAG="v${{ github.run_number }}-$(date +%s)"

          echo "Creating GitHub Release:"
          echo "$TAG"

          gh release create "$TAG" \
            "$TARGET_APK" \
            --title "Debug Build $TAG" \
            --notes "Automated Debug APK release via GitHub Actions."
