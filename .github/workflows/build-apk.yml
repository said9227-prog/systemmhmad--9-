name: Build and Release Debug APK

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      bootstrap_keystore:
        description: "Create the permanent signing keystore for the first build"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Setup Java 17
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'


      # ============================================================
      # 3. Verify Java
      # ============================================================
      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')

          if [ -z "$JAVA_VERSION" ]; then
            echo "ERROR: Failed to detect Java version."
            exit 1
          fi

          MAJOR_VERSION=$(echo "$JAVA_VERSION" | awk -F '.' \
            '{if ($1 == 1) print $2; else print $1}')

          if [ -z "$MAJOR_VERSION" ]; then
            echo "ERROR: Failed to detect major Java version."
            exit 1
          fi

          echo "Detected Java Major Version: $MAJOR_VERSION"

          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Java version is lower than 17."
            exit 1
          fi


      # ============================================================
      # 4. Setup Gradle 9.3.1
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'


      # ============================================================
      # 5. Prepare permanent signing keystore
      #
      # Priority:
      # 1. DEBUG_KEYSTORE_BASE64 secret
      # 2. One-time bootstrap generation
      #
      # IMPORTANT:
      # After bootstrap, save the generated keystore as
      # DEBUG_KEYSTORE_BASE64 before making normal builds.
      # ============================================================
      - name: Prepare stable signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          BOOTSTRAP_KEYSTORE: ${{ inputs.bootstrap_keystore }}
        run: |
          set -e

          mkdir -p "$HOME/.android"

          KEYSTORE="$HOME/.android/debug.keystore"

          echo "============================================================"
          echo "Preparing stable signing keystore"
          echo "============================================================"

          # --------------------------------------------------------
          # CASE 1:
          # Existing permanent secret
          # --------------------------------------------------------
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then

            echo "DEBUG_KEYSTORE_BASE64 found."
            echo "Restoring permanent signing keystore..."

            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

            if [ ! -s "$KEYSTORE" ]; then
              echo "ERROR: Restored keystore is empty."
              exit 1
            fi

            echo "Permanent signing keystore restored successfully."

          # --------------------------------------------------------
          # CASE 2:
          # One-time bootstrap
          # --------------------------------------------------------
          elif [ "$BOOTSTRAP_KEYSTORE" = "true" ]; then

            echo "No DEBUG_KEYSTORE_BASE64 secret found."
            echo "Bootstrap mode enabled."
            echo "Generating the permanent signing keystore..."

            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000

            if [ ! -s "$KEYSTORE" ]; then
              echo "ERROR: Failed to create debug.keystore."
              exit 1
            fi

            echo ""
            echo "============================================================"
            echo "BOOTSTRAP KEYSTORE CREATED"
            echo "============================================================"
            echo "The keystore will be uploaded as a temporary artifact."
            echo ""
            echo "IMPORTANT:"
            echo "Download the artifact and add it to:"
            echo "DEBUG_KEYSTORE_BASE64"
            echo "in GitHub Repository Secrets."
            echo "============================================================"

          # --------------------------------------------------------
          # CASE 3:
          # No secret and no bootstrap
          # --------------------------------------------------------
          else

            echo "============================================================"
            echo "ERROR: Permanent signing key is not configured."
            echo "============================================================"
            echo ""
            echo "You must first run this workflow manually with:"
            echo ""
            echo "bootstrap_keystore = true"
            echo ""
            echo "Then download the generated stable-debug-keystore"
            echo "artifact and create the GitHub Secret:"
            echo ""
            echo "DEBUG_KEYSTORE_BASE64"
            echo ""
            echo "Do NOT run normal builds until the secret is configured."
            echo "============================================================"

            exit 1
          fi


      # ============================================================
      # 6. Verify keystore
      # ============================================================
      - name: Verify stable signing keystore
        run: |
          set -e

          KEYSTORE="$HOME/.android/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then
            echo "ERROR: debug.keystore does not exist."
            exit 1
          fi

          echo "Keystore file:"
          ls -lh "$KEYSTORE"

          echo ""
          echo "============================================================"
          echo "SIGNING CERTIFICATE"
          echo "============================================================"

          keytool -list \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey

          echo ""
          echo "============================================================"
          echo "SHA-1"
          echo "============================================================"

          keytool -list \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            | grep -i "SHA1:" || true


      # ============================================================
      # 7. Upload bootstrap keystore
      #
      # This only matters during the first bootstrap run.
      # Retention is intentionally short.
      # ============================================================
      - name: Upload stable debug keystore
        if: ${{ inputs.bootstrap_keystore == true }}
        uses: actions/upload-artifact@v4
        with:
          name: stable-debug-keystore
          path: ${{ env.HOME }}/.android/debug.keystore
          if-no-files-found: error
          retention-days: 1


      # ============================================================
      # 8. Make Gradle Wrapper executable if available
      # ============================================================
      - name: Prepare Gradle wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper not found."
            echo "Using installed Gradle."
          fi


      # ============================================================
      # 9. Build Debug APK
      # ============================================================
      - name: Build the debug APK
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon


      # ============================================================
      # 10. Find generated APK
      # ============================================================
      - name: Find generated APK
        run: |
          set -e

          echo "Searching for generated APK files..."

          find . \
            -type f \
            -name "*.apk" \
            -print

          echo ""

          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: Expected APK was not found:"
            echo "$TARGET_APK"

            echo ""
            echo "Available APK files:"

            find . \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo ""
          echo "APK successfully generated:"
          ls -lh "$TARGET_APK"


      # ============================================================
      # 11. Verify APK
      # ============================================================
      - name: Verify the APK
        run: |
          set -e

          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: APK file does not exist."
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: APK file is empty."
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$TARGET_APK")

          echo "APK size: $APK_SIZE bytes"

          if [ "$APK_SIZE" -lt 10000 ]; then
            echo "ERROR: APK size is suspiciously small."
            exit 1
          fi

          echo "APK file verification successful."


      # ============================================================
      # 12. Find apksigner
      # ============================================================
      - name: Find apksigner
        id: apksigner
        run: |
          set -e

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          echo "apksigner found:"
          echo "$APKSIGNER"

          echo "path=$APKSIGNER" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 13. Verify APK signature
      # ============================================================
      - name: Verify APK signature
        run: |
          set -e

          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="${{ steps.apksigner.outputs.path }}"

          echo "Verifying APK signature..."

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$TARGET_APK"


      # ============================================================
      # 14. Get SHA-1 from FINAL APK
      # ============================================================
      - name: Get SHA-1 from final APK
        run: |
          set -e

          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="${{ steps.apksigner.outputs.path }}"

          echo "Reading certificate from final APK..."

          CERT_OUTPUT=$("$APKSIGNER" verify \
            --print-certs \
            "$TARGET_APK")

          echo ""
          echo "========== APK CERTIFICATE =========="
          echo "$CERT_OUTPUT"
          echo "====================================="
          echo ""

          SHA1=$(echo "$CERT_OUTPUT" \
            | grep -i "certificate SHA-1 digest" \
            | sed 's/.*: //')

          if [ -z "$SHA1" ]; then
            echo "ERROR: Could not extract SHA-1 from APK."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "FINAL APK SHA-1"
          echo "======================================"
          echo "$SHA1"
          echo "======================================"

          SHA1_COLON=$(echo "$SHA1" \
            | sed 's/../&:/g' \
            | sed 's/:$//')

          echo ""
          echo "SHA-1 with colons:"
          echo "$SHA1_COLON"


      # ============================================================
      # 15. Upload APK as GitHub Artifact
      # ============================================================
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1


      # ============================================================
      # 16. Publish GitHub Release
      # ============================================================
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e

          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          TAG="v${{ github.run_number }}-$(date +%s)"

          echo "Creating GitHub Release:"
          echo "$TAG"

          gh release create "$TAG" \
            "$TARGET_APK" \
            --title "Debug Build $TAG" \
            --notes "Automated Debug APK release via GitHub Actions."
